# =============================================================================
# Recorder -> launcher end-to-end compatibility gate (THE RECORDER EDGE).
#
# THIN CALLER.  All of the work -- building the real launcher, the real
# codetracer desktop core and THIS recorder, staging the codetracer-desktop
# component bundle, running `ct record` through the LAUNCHER binary and decoding
# the produced trace with `ct-print` -- lives in one reusable workflow so the
# assertions can never drift between the three trigger directions:
#
#   metacraft-labs/codetracer/.github/workflows/launcher-recorder-e2e.yml
#
# Design: codetracer-specs/Testing/Launcher-Recorder-Compatibility-Tests.md
#         section 6 "CI wiring: three trigger edges, one reusable workflow".
# Milestone: LRC-3.
#
# WHAT THIS EDGE PINS.  This repository is the one under test, so it is pinned
# to `github.sha` -- and this caller does not have to say so.  The reusable
# workflow makes the TRIGGERING repo its primary `actions/checkout` at
# `${{ github.sha }}`, and inside a reusable workflow that context is the
# caller's.  The launcher, the desktop core and codetracer-trace-format-nim are
# cloned beside it at the revisions the per-commit WORKSPACE LOCK pins for this
# commit, per metacraft-dev-guidelines/policies/ci-shared-dev-env.md section
# 3.2.  Until milestone LRC-6 this caller passed `recorder-ref:
# ${{ github.sha }}` and the other three repos were taken at their mainline
# branch TIP, which pins nothing: the same commit of this repo built against a
# different launcher on every re-run, and `clone-siblings` reported it with a
# `::warning:: ... not reproducible` per entry.
#
# NOT GREEN YET, AND HONESTLY SO.  A lock-resolved sibling needs a workspace
# lock keyed by THIS repo's commit.  On 2026-08-21 the newest one published for
# codetracer-python-recorder in metacraft-labs/metacraft-manifests@latest is
# 2026-07-06, and this repo's current `dev` HEAD has none, so this edge fails in
# `Setup dev env` with "No workspace lock for codetracer-python-recorder" until
# the workspace tooling publishes one.  That is a loud, named failure carrying
# its own remedy, and it is the correct behaviour for a missing pin.
#
# THE REMEDY IS NOT IN THIS REPOSITORY, and that matters when this job goes
# red on a pull request: clearing it takes `repro workspace lock` in a
# workspace containing this commit plus a push to metacraft-labs/
# metacraft-manifests -- not a change here.  Do NOT paper over it by
# reintroducing a `<name>=<ref>` sibling override; that is the policy
# deviation milestone LRC-6 removed.  LRC-6's "confirm the lock-publication
# path is green first" sub-deliverable is deliberately left unticked for
# exactly this reason.
#
# WHAT IT ASSERTS ABOUT THIS REPO.  Everything comes from this repo's own
# checked-in contract fixture, `cross-repo/launcher-compat.yml`: the sample
# programs, the extensions the launcher must route, the recorder flags the
# desktop core must pass, and the expected decoded-trace shape.  If this
# recorder changes its console-script name, its output layout, its `--version`
# banner or the extensions it serves, that file has to change in the SAME
# commit -- the driver refuses to run against a fixture that disagrees with it,
# and rejects an INCOMPLETE fixture before anything is built.
#
# WHY IT IS NOT `launcher-integration.yml`.  That workflow is retained as a fast
# pre-check, but it asserts only that `ct --version` matches
# `^ct [0-9]+\.[0-9]+` and never runs `ct record`, so it is NON-AUTHORITATIVE
# for the record contract.  This gate is the authority.
#
# NO PATH FILTERS, deliberately: LRC-3's verification is precisely that a
# trivial commit triggers the edge.
# =============================================================================

name: launcher-recorder-e2e

on:
  push:
    branches: [main, dev, stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: python
    uses: metacraft-labs/codetracer/.github/workflows/launcher-recorder-e2e.yml@dev
    with:
      edge: codetracer-python-recorder@${{ github.sha }} -> launcher
      recorder-repo: codetracer-python-recorder
      recorder-lang: python
    # `inherit` rather than a named list: the CI Token Provider App ID is held
    # as a repository SECRET here and as a repository VARIABLE elsewhere in the
    # org, and the reusable workflow accepts either.
    secrets: inherit
