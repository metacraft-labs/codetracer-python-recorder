name: CI

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    # Every base branch except `agents`, which runs no CI (branching policy,
    # 2026-09-29). Not only the mainlines: stacked PRs target other feature
    # branches and need CI too (8761338).
    branches-ignore: [agents]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix-tests:
    name: Testing on Python ${{matrix.python-version}}
    runs-on: [self-hosted, linux, x64]
    strategy:
      matrix:
        #python-version: ["3.10","3.11","3.12","3.13"]
        python-version: ["3.12", "3.13"]
    env:
      # Every uv invocation in the lane -- `uv sync`, and each `uv run` that a
      # later recipe makes -- takes the lane's interpreter from here.
      # `.python-version` (3.12) would otherwise win at the first `uv run` and
      # recreate `.venv` on 3.12, which is how the 3.13 lane used to test on
      # 3.12 (`just venv 3.13` passed `-p` to one `uv sync` only).
      # `dev-exec` is `nix develop --command`, which keeps this environment.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env
        # setup-dev-env clones the siblings listed in .github/sibling-repos
        # (codetracer-trace-format, codetracer-trace-format-nim) at the
        # workspace-lock-pinned revisions before materialising the nix env.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      - name: Run the committed hooks
        # The dev shell supplies the tools for every hook in .pre-commit-config.yaml,
        # including `just lint`. The native and Python tests are separate steps below.
        run: dev-exec just check-hooks

      - name: Prepare dev environment
        run: dev-exec just venv dev

      - name: Check the lane's interpreter
        # Before the first test step, so a lane named for one version cannot
        # test on another. tests/test_ci_python_lanes.py requires this step.
        run: dev-exec just check-python ${{matrix.python-version}}

      - name: Build ct-print binary
        # The Python tests shell out to ../codetracer-trace-format-nim/ct-print
        # to decode the CTFS bundles they record. `just ct-print` compiles it
        # there; the coverage job runs the same tests and calls it too.
        run: dev-exec just ct-print

      - name: Verify recorder version metadata
        run: dev-exec python3 scripts/check_recorder_version.py

      - name: Rust tests
        run: dev-exec just cargo-test

      - name: Python tests
        run: dev-exec just py-test

  coverage:
    name: Coverage (Python 3.12)
    needs: nix-tests
    runs-on: [self-hosted, linux, x64]
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      # The interpreter the job's name states, for every uv invocation (see
      # the nix-tests job).
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env
        # setup-dev-env clones the siblings listed in .github/sibling-repos
        # (codetracer-trace-format, codetracer-trace-format-nim) at the
        # workspace-lock-pinned revisions before materialising the nix env.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      - name: Prepare dev environment (Python 3.12)
        run: dev-exec just venv dev

      - name: Check the job's interpreter
        run: dev-exec just check-python 3.12

      - name: Build ct-print binary
        # `just coverage` runs the Python tests, which need ct-print just as
        # the nix-tests job's `just py-test` does. This job has its own runner
        # and checkout, so nothing nix-tests built is here.
        run: dev-exec just ct-print

      - name: Collect coverage
        id: coverage-run
        run: dev-exec just coverage

      - name: Generate coverage comment
        if: steps.coverage-run.outcome == 'success'
        run: |
          ROOT="$(pwd)"
          dev-exec bash -c "python3 codetracer-python-recorder/scripts/generate_coverage_comment.py \
            --rust-summary codetracer-python-recorder/target/coverage/rust/summary.json \
            --python-json codetracer-python-recorder/target/coverage/python/coverage.json \
            --output codetracer-python-recorder/target/coverage/coverage-comment.md \
            --repo-root \"${ROOT}\""

      - name: Upload Rust coverage artefacts
        if: steps.coverage-run.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: |
            codetracer-python-recorder/target/coverage/rust/lcov.info
            codetracer-python-recorder/target/coverage/rust/summary.json
          if-no-files-found: warn

      - name: Upload Python coverage artefacts
        if: steps.coverage-run.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            codetracer-python-recorder/target/coverage/python/coverage.xml
            codetracer-python-recorder/target/coverage/python/coverage.json
          if-no-files-found: warn

      - name: Upload coverage comment
        if: steps.coverage-run.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-comment
          path: codetracer-python-recorder/target/coverage/coverage-comment.md
          if-no-files-found: warn

      - name: Mirror coverage artefacts to S3 (non-blocking)
        if: steps.coverage-run.outcome == 'success'
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: codetracer-python-recorder/target/coverage/
          prefix: python-recorder-coverage/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}

      - name: Comment coverage summary
        if: github.event_name == 'pull_request' && steps.coverage-run.outcome == 'success'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          identifier: coverage-summary
          body-path: codetracer-python-recorder/target/coverage/coverage-comment.md

  nix-build:
    name: Verify nix flake packages build
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      # The flake supplies the trace-format crates and the Nim writer as inputs,
      # so this build uses none of the siblings setup-dev-env clones.
      - name: Build rust-backed recorder
        run: nix build .#default

      - name: Build pure-python recorder
        run: nix build .#codetracer-pure-python-recorder

      - name: Record with the store-built recorder
        run: bash tests/test_nix_package_builds.sh
