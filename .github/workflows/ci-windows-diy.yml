name: CI (windows-diy)

# Replays the project's Windows DIY dev env (env.ps1 + scoop/winget
# managed toolchain) through the shared `setup-dev-env` composite
# action's `windows-diy` flavor.  Runs alongside `ci.yml` (Linux
# `nix`) and `ci-reprobuild.yml` (multi-OS reprobuild) so all three
# dev-env paths gate merges — see
# `metacraft-dev-guidelines/policies/ci-shared-dev-env.md` §4
# (Migration story) for the rollout shape.
#
# The Windows DIY path is the developer-facing contract on Windows
# (`. .\env.ps1; just test`), so this workflow exists to catch
# Windows-only regressions that the Linux `nix` job can't surface
# and that the reprobuild path could silently hide under its own
# tool-provisioning code.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-diy:
    name: Windows DIY — just build/test
    # Single label, not an array: `runs-on: [a, b]` is an AND over labels (one
    # runner carrying BOTH), not a fallback. eph-win-x64 and eph-win-arm64 are
    # separate pools on separate hosts, so the array matched no runner and the
    # job queued until GitHub's 24h timeout. To span both classes use a matrix
    # axis (`matrix: runs-on: [...]` + `runs-on: ${{ matrix.runs-on }}`).
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Mint installation token for workspace manifests
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env (windows-diy flavor)
        # Clones the siblings in .github/sibling-repos
        # (codetracer-trace-format, codetracer-trace-format-nim) to ../<name>
        # at the revisions this commit's repro.lock pins -- the same set, at
        # the same revisions, as every other workflow here. env.ps1 provisions
        # its own toolchain and does not read ../codetracer, so that checkout
        # is not needed.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: windows-diy
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: just build
        run: dev-exec just build

      - name: just test
        run: dev-exec just test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diy-logs
          path: |
            target/
            test-logs/
          retention-days: 7
          if-no-files-found: ignore
