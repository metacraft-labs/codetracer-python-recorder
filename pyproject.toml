[project]
name = "codetracer-python-recorders"
version = "0.2.0"

# This is the uv WORKSPACE root. Its `requires-python` governs the environment
# `uv sync` builds, and that environment installs every member listed under
# [tool.uv.workspace] plus the [dependency-groups] below — including
# `codetracer-python-recorder`, which is a PyO3 extension module and is
# therefore ABI-locked to a CPython minor version. So the workspace root cannot
# honestly claim a wider window than its narrowest member.
#
# It said ">=3.8". That was false in both directions: `uv sync -p 3.8` was
# accepted here and then failed resolving the compiled member, and anything
# reading this file to decide which interpreters are supported was told four
# minor versions that do not work. It now matches
# codetracer-python-recorder/pyproject.toml exactly.
#
# codetracer-pure-python-recorder/pyproject.toml keeps its own, wider window:
# it is pure Python with no compiled part, so it genuinely runs on more
# interpreters than the workspace as a whole does. The two are different
# claims and are stated separately rather than averaged.
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
managed = true

[tool.uv.workspace]
members = [
  "codetracer-python-recorder",
  "codetracer-pure-python-recorder",
]

[tool.uv.sources]
codetracer-python-recorder = {workspace= true}
codetracer-pure-python-recorder = {workspace= true}

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "coverage[toml]>=7.6.0",
]

test = [
  "codetracer-python-recorder",
  "codetracer-pure-python-recorder"
]

# RS-M5 (Request Panel live sessions): the three web frameworks whose middleware
# integration the recorder ships, plus an ASGI server to run the FastAPI demo
# over real HTTP.  Needed by `tests/python/test_request_spans.py` and by
# `just demo-request-panel-python`; kept in its own group so the core test run
# does not pull a web stack it never imports.
web = [
  "flask>=2.3",
  "django>=4.2",
  "fastapi>=0.100",
  "uvicorn>=0.23",
]
